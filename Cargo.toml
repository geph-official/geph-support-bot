[package]
name = "geph-support-bot"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[profile.release]
panic = "abort"

[dependencies]
acidjson = "0.1.3"
anyhow = "1.0.70"
argh = "0.1.10"
async-broadcast = "0.5.1"
async-compat = "0.2.1"
async-trait = "0.1.80"
base64 = "0.21.2"
cached = {version="0.56.0", features=["async"]} 
chrono = "0.4.38"
env_logger = "0.10.0"
futures-util = "0.3.28"
isahc = {version="1.7.2", features=["json"]}
log = "0.4.17"
nursery_macro = "0.1.0"
once_cell = "1.17.1"
rand = "0.8.5"
regex = "1.8.3" 
reqwest = "0.12.5"
schemars = "0.8.21"
serde = {version="1.0.160", features=["derive"]}
serde_json = "1.0.96"
serde_yaml = "0.9.21"
smol = "1.3.0"
smol-timeout = "0.6.0"
smolscale = "0.3.52"
sqlx = {version="0.6.3", features=["sqlite", "postgres", "runtime-async-std-rustls"]}
warp = "0.3.5"
